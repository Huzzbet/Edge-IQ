<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge-IQ — EV Finder</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#eef3ff;margin:0}.wrap{max-width:1500px;margin:auto;padding:24px}.panel{background:#11182a;border:1px solid #273451;border-radius:16px;padding:16px;margin:14px 0}h1{margin:0}label{font-size:11px;color:#8f9bb5;text-transform:uppercase}input,select,button{padding:11px;border-radius:10px;border:1px solid #273451;background:#0d1426;color:#eef3ff}button{background:#67e8a5;color:#07140d;font-weight:800;cursor:pointer}.controls{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:10px}.control{display:flex;flex-direction:column;gap:6px}.status{color:#8f9bb5}.ok{color:#67e8a5}.error{color:#ff6b7a}.warn{color:#ffd166}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1400px}th,td{padding:10px;border-bottom:1px solid #273451;text-align:left;white-space:nowrap}th{color:#8f9bb5;font-size:10px}.best,.positive{color:#67e8a5;font-weight:800}.negative{color:#ff6b7a;font-weight:800}.empty{text-align:center;padding:40px;color:#8f9bb5}@media(max-width:700px){.wrap{padding:14px}.controls{grid-template-columns:1fr 1fr}.load{grid-column:1/-1;width:100%}}</style></head><body><div class="wrap"><h1>Edge-IQ</h1><p>EV Finder • manual odds ingestion • EV + Kelly</p><section class="panel controls"><div class="control"><label>League</label><select id="league"><option>AFL</option><option>NBA</option><option>NBL</option></select></div><div class="control"><label>Max events</label><select id="maxEvents"><option>10</option><option selected>25</option><option>50</option></select></div><div class="control"><label>Bookmakers (optional)</label><input id="bookmakers" placeholder="sportsbet,tab,ladbrokes"></div><button id="loadBtn">LOAD LIVE ODDS</button></section><section class="panel"><label>Cloudflare Worker URL</label><input id="proxyUrl" style="width:100%;margin-top:6px" placeholder="https://edge-iq.seanhurren.workers.dev"><button id="saveProxy" style="margin-top:8px">Save Worker URL</button><p style="color:#8f9bb5;font-size:12px">Your Odds API key stays in Cloudflare as ODDS_API_KEY.</p></section><section class="panel"><div id="status">API: Not loaded • Manual loads: 0</div></section><section class="panel"><div class="table" id="table"><div class="empty">Save the Worker URL, then press LOAD LIVE ODDS.</div></div></section></div><script src="ev-engine.js"></script><script>const KEY='edgeIqApiUrl',CACHE='edgeIqCacheV4';let loads=0,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(data){const rows=[];for(const e of data.events||[]){for(const [market,m] of Object.entries(e.lines||{})){for(const b of m.books||[]){for(const s of ['home','away','draw','over','under']){const o=b[s];const odds=Number(o?.odds??o?.decimal_odds);if(odds>1)rows.push({event:`${e.home_team||''} v ${e.away_team||''}`,start:e.start_time,market,selection:o.selection_name||o.name||s,line:o.line??o.points??o.total??m.line??'',book:b.bookmaker||b.name||'Unknown',odds})}}}}if(!rows.length){$('table').innerHTML='<div class="empty">The API returned no normalised odds. We will inspect the response next.</div>';return}const grouped=new Map();rows.forEach(r=>{const k=`${r.event}|${r.market}|${r.selection}|${r.line}`;(grouped.get(k)||grouped.set(k,[]).get(k)).push(r)});const out=[];for(const g of grouped.values()){const best=Math.max(...g.map(x=>x.odds));g.forEach(r=>out.push({...r,best:r.odds===best}))}$('table').innerHTML='<table><thead><tr><th>Event</th><th>Start</th><th>Market</th><th>Selection</th><th>Line</th><th>Bookmaker</th><th>Odds</th><th>Implied %</th><th>Model %</th><th>Fair Odds</th><th>EV %</th><th>Kelly %</th><th>Stake</th></tr></thead><tbody>'+out.map(r=>`<tr><td>${esc(r.event)}</td><td>${r.start?esc(new Date(Number(r.start)*1000).toLocaleString()):'—'}</td><td>${esc(r.market)}</td><td>${esc(r.selection)}</td><td>${esc(r.line||'—')}</td><td>${esc(r.book)}</td><td class="${r.best?'best':''}">${r.odds.toFixed(2)}${r.best?' ★':''}</td><td>${(100/r.odds).toFixed(1)}%</td><td><input class="modelProb" data-odds="${r.odds}" type="number" min="0.01" max="99.99" step="0.1" placeholder="%"></td><td class="fairCell">—</td><td class="evCell">—</td><td class="kellyCell">—</td><td class="stakeCell">—</td></tr>`).join('')+'</tbody></table>';window.EdgeIQ?.bind()}async function load(){const base=localStorage.getItem(KEY);if(!base){alert('Save the Cloudflare Worker URL first.');return}const b=$('loadBtn');b.disabled=true;b.textContent='LOADING…';$('status').textContent='API: Loading…';try{const u=new URL(base);u.searchParams.set('league',$('league').value);u.searchParams.set('limit',$('maxEvents').value);if($('bookmakers').value.trim())u.searchParams.set('bookmakers',$('bookmakers').value.trim());const r=await fetch(u,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||d.detail||`Worker/API error ${r.status}`);loads++;localStorage.setItem(CACHE,JSON.stringify({loadedAt:Date.now(),data:d}));render(d);$('status').innerHTML=`API: <strong class="ok">Loaded</strong> • Last load: ${new Date().toLocaleTimeString()} • Manual loads this session: ${loads}`;}catch(e){$('status').innerHTML=`API: <strong class="error">Error</strong> • ${esc(e.message)}`}finally{b.disabled=false;b.textContent='LOAD LIVE ODDS'}}$('saveProxy').onclick=()=>{const v=$('proxyUrl').value.trim().replace(/\/$/,'');localStorage.setItem(KEY,v);$('status').textContent='Worker URL saved. Ready to load.'};$('proxyUrl').value=localStorage.getItem(KEY)||'https://edge-iq.seanhurren.workers.dev';$('loadBtn').onclick=load;</script></body></html>
